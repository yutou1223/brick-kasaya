<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="1280" viewBox="0 0 900 1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fdf8f1"/>
      <stop offset="0.55" stop-color="#f8eee0"/>
      <stop offset="1" stop-color="#f1e3d1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5a279"/>
      <stop offset="0.5" stop-color="#b04a26"/>
      <stop offset="1" stop-color="#e5a279"/>
    </linearGradient>
    <pattern id="brick" width="148" height="64" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="66" height="26" fill="#b04a26" opacity="0.10"/>
      <rect x="74" y="0" width="66" height="26" fill="#b04a26" opacity="0.10"/>
      <rect x="0" y="32" width="66" height="26" fill="#b04a26" opacity="0.10"/>
      <rect x="74" y="32" width="66" height="26" fill="#b04a26" opacity="0.10"/>
    </pattern>
    <radialGradient id="card" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fdf9f3"/>
      <stop offset="1" stop-color="#f5e9da"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#4a1f14" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="900" height="1280" fill="url(#bg)"/>
  <rect width="900" height="430" fill="url(#brick)"/>
  <rect x="60" y="50" width="780" height="1180" rx="34" fill="url(#card)" stroke="#b04a26" stroke-opacity="0.16" filter="url(#soft)"/>

  <text x="450" y="118" text-anchor="middle" font-family='"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Segoe UI",sans-serif' font-size="19" letter-spacing="7" fill="#b04a26" font-weight="600">BILINGUAL · 双语</text>
  <text x="450" y="196" text-anchor="middle" font-family='"Songti SC","STSong","Source Han Serif SC","Charter",Georgia,serif' font-size="56" font-weight="700" fill="#4a1f14">砖纹袈裟</text>
  <text x="450" y="242" text-anchor="middle" font-family='"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Segoe UI",sans-serif' font-size="23" fill="#8c3a20">The Brick-Pattern Kasaya</text>
  <rect x="388" y="272" width="124" height="4" rx="2" fill="url(#rule)"/>

  <rect x="174" y="364" width="552" height="552" rx="24" fill="#ffffff" stroke="#b04a26" stroke-opacity="0.16"/>
  <image x="190" y="380" width="520" height="520" xlink:href="data:image/png;base64,"/>

  <text x="450" y="980" text-anchor="middle" font-family='"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Segoe UI",sans-serif' font-size="27" fill="#6b2d1b">扫码自动识别语言 · 中文 / English</text>
  <text x="450" y="1014" text-anchor="middle" font-family='"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Segoe UI",sans-serif' font-size="20" fill="#8a7263">Scan to open the version that matches your phone&#39;s language</text>

  <rect x="160" y="1050" width="580" height="56" rx="28" fill="#fdf3e8" stroke="#d97a4e" stroke-opacity="0.4"/>
  <text x="450" y="1087" text-anchor="middle" font-family='"SFMono-Regular",Consolas,monospace' font-size="22" fill="#8c3a20">yutou1223.github.io/brick-kasaya/damo/</text>

  <text x="450" y="1156" text-anchor="middle" font-family='"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Segoe UI",sans-serif' font-size="17" fill="#8a7263">zh-CN · zh-TW · zh-HK → 中文版　|　all other languages → English</text>
  <text x="450" y="1200" text-anchor="middle" font-family='"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Segoe UI",sans-serif' font-size="15" fill="#a8917f">永久固定网址 · Permanent URL · HTTPS</text>
</svg>
